# pipeline.yaml —— 步骤清单：由 pipeline2main.py 生成 main.nf，
# 由 yaml2config.py 生成 pipeline.generated.config（资源/调度器覆盖模块默认值）。
# 只放流程结构；镜像归模块 config，outdir/样本路径归项目 config。
# 解析器要求扁平结构：顶层标量 + steps 列表，steps 每项扁平键值。

samples_file: samples.csv
samples_columns: sample_id,r1,r2
samples_types: val,path,path

steps:
  - name: assemble
    module: metaspades
    process: MetaSpades
    input: samples            # samples = 样本表通道；或前一步的 name
    output: assemble_out
    emit: contig
    executor: sge
    queue: mid.q,sci.q
    cpus: 32
    memory: 250 GB
    depends_on: []

  - name: align
    module: metaspades_align
    process: MetaSpades_Align
    # ⚠️ 双输入步骤（contigs join reads），main.nf 中该接线为手写；
    #    此处 input/emit 与资源仅作 manifest，勿用 pipeline2main.py 覆盖 main.nf
    input: assemble
    emit: contig
    executor: sge
    queue: micro.q,sci.q,mid.q
    cpus: 8
    memory: 20 GB
    depends_on: [assemble]
